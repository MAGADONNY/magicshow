<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGADONNY Magic Show | Unvergessliche Momente</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c5a059;
            --primary-light: #dfba76;
            --dark: #0a0a0a;
            --dark-surface: #121212;
            --card-bg: #181818;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: rgba(197, 160, 89, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Suptilne zlatne čestice / zvezdice preko stranice */
        .magic-sparkles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 900;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: var(--size, 4px);
            height: var(--size, 4px);
            border-radius: 50%;
            background: radial-gradient(circle, #fff3cc 0%, var(--primary-light) 55%, transparent 100%);
            box-shadow: 0 0 8px rgba(223, 186, 118, 0.75);
            opacity: 0;
            animation: sparkleFloat var(--duration, 7s) ease-in-out var(--delay, 0s) infinite;
        }

        .sparkle--star {
            border-radius: 0;
            background: transparent;
            box-shadow: none;
        }

        .sparkle--star::before,
        .sparkle--star::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(90deg, transparent, #fff4d2, transparent);
            border-radius: 999px;
        }

        .sparkle--star::before {
            width: 100%;
            height: 1.5px;
        }

        .sparkle--star::after {
            width: 1.5px;
            height: 100%;
        }

        @keyframes sparkleFloat {
            0% {
                opacity: 0;
                transform: translate3d(0, 12px, 0) scale(0.5);
            }
            20% {
                opacity: var(--peak-opacity, 0.75);
            }
            50% {
                opacity: calc(var(--peak-opacity, 0.75) * 0.45);
                transform: translate3d(var(--drift-x, 8px), -14px, 0) scale(1.1);
            }
            80% {
                opacity: var(--peak-opacity, 0.75);
            }
            100% {
                opacity: 0;
                transform: translate3d(calc(var(--drift-x, 8px) * -0.5), -32px, 0) scale(0.6);
            }
        }

        /* Header / Nav */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 2px;
            text-decoration: none;
            display: flex;
            gap: 10px;
            align-items: baseline;
        }

        .logo span {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Phone Numbers Container in Header */
        .header-phones {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
        }

        .phone-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-light);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            background: rgba(197, 160, 89, 0.08);
            border: 1px solid rgba(197, 160, 89, 0.2);
        }

        .phone-link:hover {
            background: var(--primary);
            color: var(--dark);
            border-color: var(--primary);
        }

        .flag-icon {
            font-size: 1rem;
            line-height: 1;
        }

        /* Hero Banner - sa hero-aces.png slikom */
        .hero-banner {
            position: relative;
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 9rem 5% 5rem;
            background: linear-gradient(180deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.92) 100%),
