<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGADONNY Magic Show | Close-Up-Magie</title>

    <style>
        :root {
            --primary: #c5a059;
            --primary-light: #dfba76;
            --dark: #0a0a0a;
            --card-bg: #141414;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: rgba(197, 160, 89, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header / Nav */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 2px;
            text-decoration: none;
            display: flex;
            gap: 8px;
            align-items: baseline;
        }

        .logo span {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 1px;
        }

            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
